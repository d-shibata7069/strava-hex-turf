name: Athlete identity regression

on:
  pull_request:
    paths:
      - 'client/**'
      - 'backend-api/**'
      - '.github/workflows/identity-tests.yml'
  push:
    branches: [develop]
    paths:
      - 'client/**'
      - 'backend-api/**'
      - '.github/workflows/identity-tests.yml'

permissions:
  contents: read

jobs:
  identity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend-api/package-lock.json
            client/package-lock.json
      - run: npm ci
        working-directory: backend-api
      - run: npm test && npm run build
        working-directory: backend-api
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
